apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stage6-api.fullname" . }}
  labels:
    {{- include "stage6-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "stage6-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "stage6-api.selectorLabels" . | nindent 8 }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-init-first: "true"
        vault.hashicorp.com/role: "stage7-api-role"
        vault.hashicorp.com/agent-inject-secret-config.env: "secret/data/stage7-api"
        vault.hashicorp.com/agent-inject-template-config.env: |
{{ `          {{- with secret "secret/data/stage7-api" -}}
          DB_PASSWORD={{ .Data.data.db_password }}
          API_KEY={{ .Data.data.api_key }}
          {{- end -}}` | indent 10 }}
    spec:
      serviceAccountName: stage7-api-sa
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ include "stage6-api.fullname" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
